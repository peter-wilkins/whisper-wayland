name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.13
      
    - name: Install dependencies
      run: uv sync
      
    - name: Install system dependencies for audio and text insertion
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev \
          pulseaudio \
          alsa-utils \
          ydotool \
          wl-clipboard \
          xclip
      
    - name: Run linting
      run: |
        uv run ruff check whisper_claude/ --output-format=github
        uv run ruff format whisper_claude/ --check
        
    - name: Run type checking
      run: uv run mypy whisper_claude/ --strict || true
      
    - name: Run tests
      run: uv run pytest tests/ -v --tb=short --disable-warnings
      env:
        # Mock OpenAI API key for testing
        OPENAI_API_KEY: sk-test-mock-key-for-github-actions
        # Configure test environment
        LOG_LEVEL: WARNING
        AUDIO_SAMPLE_RATE: 16000
        AUDIO_CHUNK_SIZE: 1024
        MAX_RECORDING_DURATION: 30
        HOTKEY: compose
        TEXT_INSERTION_METHOD: ydotool
        TEXT_INSERTION_DELAY: 0.1
        # Disable audio device detection warnings in CI
        PYTEST_CURRENT_TEST: true
        
    - name: Run tests with coverage (unit tests only)
      run: |
        uv run pytest tests/unit/ -v \
          --cov=whisper_claude \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-fail-under=30 \
          --tb=short \
          --disable-warnings
      env:
        # Mock OpenAI API key for testing  
        OPENAI_API_KEY: sk-test-mock-key-for-github-actions
        # Configure test environment
        LOG_LEVEL: WARNING
        AUDIO_SAMPLE_RATE: 16000
        AUDIO_CHUNK_SIZE: 1024
        MAX_RECORDING_DURATION: 30
        HOTKEY: compose
        TEXT_INSERTION_METHOD: ydotool
        TEXT_INSERTION_DELAY: 0.1
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30