name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.13
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev
      
    - name: Install dependencies
      run: uv sync
      
    - name: Run ruff linting
      run: uv run ruff check whisper_wayland/ --output-format=github
      
    - name: Run ruff formatting check
      run: uv run ruff format whisper_wayland/ --check
      
    - name: Run mypy type checking
      run: uv run mypy whisper_wayland/ --strict
      continue-on-error: true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LOG_LEVEL: ERROR
      HOTKEY: compose
      TEXT_INSERTION_METHOD: ydotool
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev \
          pulseaudio \
          alsa-utils \
          ydotool \
          wl-clipboard \
          xclip
      
    - name: Install dependencies
      run: uv sync
      
    - name: Run unit tests
      run: |
        uv run pytest tests/unit/ -v \
          --tb=short \
          --disable-warnings \
          -x
        
    - name: Run integration tests (Python 3.13 only)
      if: matrix.python-version == '3.13'
      run: |
        uv run pytest tests/integration/ -v \
          --tb=short \
          --disable-warnings \
          -x

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LOG_LEVEL: ERROR
      HOTKEY: compose
      TEXT_INSERTION_METHOD: ydotool
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.13
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev \
          ydotool \
          wl-clipboard \
          xclip
      
    - name: Install dependencies
      run: uv sync
      
    - name: Run tests with coverage
      run: |
        uv run pytest tests/unit/ \
          --cov=whisper_wayland \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-report=xml \
          --cov-fail-under=30 \
          --tb=short \
          --disable-warnings
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.13
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev
      
    - name: Install dependencies
      run: uv sync
      
    - name: Run bandit security linter
      run: uv run bandit -r whisper_wayland/ -f json -o bandit-report.json
      continue-on-error: true
      
    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json
        retention-days: 30