name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LOG_LEVEL: INFO

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          alsa-utils \
          libasound2-dev \
          libportaudio2 \
          portaudio19-dev \
          pulseaudio \
          wl-clipboard \
          wtype \
          xclip \
          ydotool
      
    - name: Install Python dependencies
      run: uv sync
      
    - name: Cache environment and source
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/uv
          .venv
          .
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.sha }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

  test:
    name: Runs Tests
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Restore environment and source cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/uv
          .venv
          .
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.sha }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        fail-on-cache-miss: true
      
    - name: Run complete pipeline
      run: make all

  coverage:
    name: Create Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Restore environment and source cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/uv
          .venv
          .
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.sha }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        fail-on-cache-miss: true
      
    - name: Run tests with coverage
      run: |
        uv run pytest tests/unit/ \
          --cov=whisper_wayland \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-report=xml \
          --cov-fail-under=75 \
          --tb=short \
          --disable-warnings
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

  security:
    name: Create Security Report
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    
    steps:
    - name: Restore environment and source cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/uv
          .venv
          .
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.sha }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        fail-on-cache-miss: true
      
    - name: Run bandit security linter
      run: uv run bandit -r whisper_wayland/ -f json -o bandit-report.json
      continue-on-error: true
      
    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report-${{ matrix.python-version }}
        path: bandit-report.json
        retention-days: 30
